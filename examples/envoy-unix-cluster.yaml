# Replace the ad-auth cluster in envoy.yaml with this list entry.
# Both processes must share the socket directory and run as the same UID.
- name: ad-auth
  connect_timeout: 0.25s
  type: STATIC
  http2_protocol_options: {}
  load_assignment:
    cluster_name: ad-auth
    endpoints:
      - lb_endpoints:
          - endpoint:
              address:
                pipe: {path: /run/envoy-ad-auth/auth.sock}
